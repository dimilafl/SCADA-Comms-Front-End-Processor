<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Explosion Playground</title>
    <link rel="stylesheet" href="/static/playground.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="ui-panel">
        <div class="title">
            <h1>✨ Particle Explosion Playground</h1>
            <p class="subtitle">Click anywhere to create explosions!</p>
        </div>

        <div class="controls">
            <div class="control-section">
                <h3>🎨 Explosion Mode</h3>
                <div class="button-group">
                    <button class="mode-btn active" data-mode="rainbow">🌈 Rainbow</button>
                    <button class="mode-btn" data-mode="fire">🔥 Fire</button>
                    <button class="mode-btn" data-mode="ice">❄️ Ice</button>
                    <button class="mode-btn" data-mode="galaxy">🌌 Galaxy</button>
                    <button class="mode-btn" data-mode="electric">⚡ Electric</button>
                    <button class="mode-btn" data-mode="neon">💫 Neon</button>
                </div>
            </div>

            <div class="control-section">
                <h3>✨ Effects</h3>
                <label class="checkbox-label">
                    <input type="checkbox" id="mouseTrail" checked>
                    <span>Mouse Trail</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="gravity" checked>
                    <span>Gravity</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="bounce">
                    <span>Bounce</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="glow" checked>
                    <span>Glow Effect</span>
                </label>
            </div>

            <div class="control-section">
                <h3>⚙️ Settings</h3>
                <div class="slider-group">
                    <label>
                        Particle Count: <span id="particleCountValue">100</span>
                        <input type="range" id="particleCount" min="20" max="300" value="100" step="10">
                    </label>
                    <label>
                        Explosion Force: <span id="explosionForceValue">10</span>
                        <input type="range" id="explosionForce" min="5" max="20" value="10" step="1">
                    </label>
                    <label>
                        Particle Size: <span id="particleSizeValue">3</span>
                        <input type="range" id="particleSize" min="1" max="8" value="3" step="0.5">
                    </label>
                    <label>
                        Trail Length: <span id="trailLengthValue">20</span>
                        <input type="range" id="trailLength" min="5" max="50" value="20" step="5">
                    </label>
                </div>
            </div>

            <div class="control-section">
                <button class="clear-btn" id="clearBtn">🗑️ Clear All</button>
                <a href="/" class="back-link">← Back to Dashboard</a>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Active Particles:</span>
                <span class="stat-value" id="particleCount-stat">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">FPS:</span>
                <span class="stat-value" id="fps">60</span>
            </div>
        </div>
    </div>

    <div class="instructions">
        <p>🖱️ Click to create explosions • 🖐️ Drag for continuous explosions • 🎨 Try different modes!</p>
    </div>

    <script src="/static/playground.js"></script>
</body>
</html>
